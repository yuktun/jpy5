<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 13 課 Flashcards · 日本語 Year 5</title><link rel="stylesheet" href="assets/styles.css?v=21"><script src="assets/data.js?v=3" defer></script><script src="assets/grammar-ruby.js?v=6" defer></script><script src="assets/common.js?v=3" defer></script><script src="assets/flashcards.js?v=6" defer></script></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">五</span><span>日本語 <b>Year 5</b></span></a><div class="header-actions"><a class="back-link" href="chapter-13.html">← 第 13 課</a><label class="theme-control">主題<select data-theme-select aria-label="頁面主題"><option value="auto">自動</option><option value="light">光亮</option><option value="dark">深色</option></select></label></div></header>
<main class="study-shell"><section class="compact-hero"><p class="kicker">LESSON 13 · GRAMMAR FLASHCARDS</p><h1>翻一翻，記得更牢。</h1><p>8 張句型概要及 25 張教材例句；Space 翻面，← → 換卡，位置、標記和成績會自動保存。</p></section>
<nav class="lesson-pills module-lesson-switcher" aria-label="課次"><a class="active" aria-current="page" href="chapter-13-flashcards.html">第13課</a><a href="chapter-14-flashcards.html">第14課</a><a href="chapter-15-flashcards.html">第15課</a><a href="chapter-16-flashcards.html">第16課</a></nav>
<section class="study-controls" aria-label="Flashcard 設定"><div class="segmented"><button data-deck="summary">句型概要</button><button data-deck="examples">例句練習</button></div><div class="segmented"><button data-direction="jp">日文 → 解釋</button><button data-direction="zh">中文 → 文法</button></div><button class="chip" id="shuffle-toggle">循序模式</button></section>
<section class="flashcard-area"><div class="study-stats"><span id="deck-label"></span><span id="fc-stats"></span></div><button class="flashcard" id="flashcard" type="button" aria-label="點擊翻面"><span class="card-kicker" id="card-kicker"></span><div id="card-front"></div><div id="card-back" hidden></div><small id="flip-hint">點擊或按 Space 查看答案</small></button>
<div class="jump-row"><label>前往 <input id="card-jump" type="number" min="1" inputmode="numeric" aria-label="卡片編號"></label><span id="card-total"></span></div>
<div class="card-actions"><button id="prev-card" aria-label="上一張">←</button><button id="mark-wrong" class="danger">✕ <span id="wrong-count">0</span></button><button id="star-card" aria-label="標記卡片">☆</button><button id="mark-right" class="success">✓ <span id="right-count">0</span></button><button id="next-card" aria-label="下一張">→</button></div></section>
<section class="review-panel"><h2>針對性重溫</h2><div class="filter-row"><button data-filter="all">全部</button><button data-filter="right">✓ 答對</button><button data-filter="wrong">✕ 答錯</button><button data-filter="starred">★ 已標記</button></div><button class="text-button" id="reset-flashcards">↻ 清除 Flashcard 進度</button></section></main><footer>進度只儲存在此瀏覽器。</footer></body></html>
