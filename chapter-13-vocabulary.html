  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">五</span><span>日本語 <b>Year 5</b></span></a>
    <div class="header-actions"><a class="back-link" href="chapter-13.html">← 第 13 課</a><label class="theme-control">主題<select data-theme-select aria-label="頁面主題"><option value="auto">自動</option><option value="light">光亮</option><option value="dark">深色</option></select></label></div>
  </header>
  <main class="study-shell">
    <section class="compact-hero vocab-hero">
      <p class="kicker">LESSON 13 · COMPLETE VOCABULARY</p>
      <h1>完整詞彙</h1>
      <p>第 13 課全 159 詞：文法・練習 31 詞、話す・聞く 38 詞、読む・書く 90 詞。可分類學習、雙向翻卡及針對性重溫。</p>
      <div class="vocab-summary"><span><strong>159</strong> 全部詞彙</span><span><strong id="vocab-right-count">0</strong> 答對</span><span><strong id="vocab-wrong-count">0</strong> 答錯</span><span><strong id="vocab-star-count">0</strong> 收藏</span></div>
    </section>

    <section class="vocab-complete-layout">
      <div class="vocab-card-column">
        <div class="section-heading"><div><p class="kicker">FLASHCARDS</p><h2>詞彙記憶卡</h2></div><span id="vocab-progress"></span></div>
        <div class="vocab-section-tabs" aria-label="記憶卡詞彙分類">
          <button data-vocab-section="all">全部 159</button><button data-vocab-section="grammar">文法 31</button><button data-vocab-section="speaking">會話 38</button><button data-vocab-section="reading">閱讀 90</button>
        </div>
        <div class="vocab-mode-controls" aria-label="記憶卡設定">
          <div class="segmented"><button data-vocab-direction="normal" aria-label="假名到漢字或英文原寫"><span class="direction-full">假名 → 漢字・原寫</span><span class="direction-short">假名 → 漢字</span></button><button data-vocab-direction="reverse" aria-label="Reverse：漢字或英文原寫到假名"><span class="direction-full">Reverse · 漢字・原寫 → 假名</span><span class="direction-short">Reverse → 假名</span></button></div>
          <button class="chip" id="vocab-shuffle" type="button">循序模式</button>
        </div>
        <div class="filter-row vocab-review-filters" aria-label="重溫分類"><button data-vocab-filter="all">全部</button><button data-vocab-filter="wrong">答錯</button><button data-vocab-filter="right">答對</button><button data-vocab-filter="starred">收藏</button></div>
        <button class="vocab-card" id="vocab-card" type="button"><span id="vocab-card-number"></span><div id="vocab-card-front"></div><div id="vocab-card-back" hidden></div><small>點擊或按 Space 翻面</small></button>
        <div class="jump-row"><label for="vocab-jump">跳至</label><input id="vocab-jump" type="number" min="1" inputmode="numeric"><span id="vocab-total"></span></div>
        <div class="card-actions compact"><button id="vocab-prev" aria-label="上一個">←</button><button class="danger" id="vocab-wrong" aria-label="標記答錯">×</button><button id="vocab-star" aria-label="收藏">☆</button><button class="success" id="vocab-right" aria-label="標記答對">✓</button><button id="vocab-next" aria-label="下一個">→</button></div>
        <button class="text-button" id="reset-vocabulary" type="button">清除詞彙進度</button>
      </div>

      <div class="vocab-list-column">
        <div class="section-heading"><div><p class="kicker">WORD LIST</p><h2>159 詞詞彙表</h2></div><span id="vocab-count"></span></div>
        <div class="vocab-list-tools"><select id="list-section" aria-label="詞彙表分類"><option value="all">全部分類</option><option value="grammar">文法・練習</option><option value="speaking">話す・聞く</option><option value="reading">読む・書く</option></select><input class="search-input" id="vocab-search" type="search" placeholder="搜尋假名、漢字、外語原寫或中文意思"></div>
        <div class="vocab-list" id="vocab-list"></div>
      </div>
    </section>
  </main>
  <footer>內容依據 Chapter 13 Vocabulary PDF 全 159 詞整理；學習進度只儲存在本機裝置。</footer>
